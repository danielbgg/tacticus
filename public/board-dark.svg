<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800">
  <!--
    fractalNoise (não turbulence) = curvas orgânicas suaves, não linhas rígidas
    baseFrequency X=0.07: ~5-6 bandas de grão por casa de 80px — como nogueira real
    baseFrequency Y=0.025: grão curva ligeiramente na vertical
    numOctaves=8: detalhe em múltiplas escalas (fibras finas sobre bandas largas)
    seed=12: padrão único
    tile 800×800: num tabuleiro de ~640px não repete de todo
  -->
  <filter id="w" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.07 0.025"
      numOctaves="8"
      seed="12"
      result="noise"
    />
    <feColorMatrix type="saturate" values="0" in="noise" result="grain"/>
    <feComponentTransfer in="grain">
      <!-- slope=1.35 aumenta contraste das fibras; intercept centra em 0.5 -->
      <feFuncR type="linear" slope="1.35" intercept="-0.175"/>
      <feFuncG type="linear" slope="1.35" intercept="-0.175"/>
      <feFuncB type="linear" slope="1.35" intercept="-0.175"/>
    </feComponentTransfer>
  </filter>
  <rect width="800" height="800" fill="#808080" filter="url(#w)"/>
</svg>
