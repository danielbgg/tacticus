<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Board Color Preview — Chess.com Match</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e24; font-family: sans-serif; color: #fff; padding: 24px; }
    h1 { font-size: 16px; margin-bottom: 20px; color: #ccc; }

    .layout { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }

    /* Board */
    .board-frame { display: inline-block; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,0,0,0.8); }
    .board { position: relative; }
    .grid { display: grid; grid-template-columns: repeat(8, 70px); grid-template-rows: repeat(8, 70px); }
    .sq { width: 70px; height: 70px; }
    .overlay-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Controls */
    .controls { display: flex; flex-direction: column; gap: 16px; min-width: 300px; }
    .ctrl-group { background: #2a2a32; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .ctrl-group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 4px; }
    .ctrl-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .ctrl-row label { width: 90px; color: #aaa; }
    input[type=color] { width: 44px; height: 28px; border: none; border-radius: 4px; cursor: pointer; background: none; padding: 0; }
    input[type=text] { width: 80px; background: #1e1e24; border: 1px solid #444; border-radius: 4px; color: #fff; font-size: 13px; padding: 3px 6px; font-family: monospace; }
    input[type=range] { flex: 1; accent-color: #c9a227; }
    .swatch { width: 28px; height: 28px; border-radius: 4px; border: 1px solid #555; }

    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .preset-btn {
      background: #35353f; border: 1px solid #48484e; border-radius: 4px;
      color: #ccc; font-size: 11px; padding: 4px 8px; cursor: pointer;
      transition: background 0.15s;
    }
    .preset-btn:hover { background: #48484e; }
    .preset-btn.active { border-color: #c9a227; color: #c9a227; }

    .code-box { background: #1e1e24; border: 1px solid #48484e; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12px; color: #7dd3fc; white-space: pre; }

    /* Comparison row */
    .compare { display: flex; gap: 24px; align-items: center; }
    .compare-label { font-size: 11px; color: #888; text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
<h1>Board Preview — encontra as cores certas antes de mudar o código</h1>
<div class="layout">

  <!-- Boards comparison -->
  <div>
    <div class="compare">
      <div>
        <div id="my-board-wrap"></div>
        <div class="compare-label">Tacticus (editável)</div>
      </div>
      <div>
        <div id="chesscom-board-wrap"></div>
        <div class="compare-label">Chess.com (referência)</div>
      </div>
    </div>

    <div style="margin-top:20px">
      <h3 style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">Código para copiar → Tabuleiro.tsx</h3>
      <div class="code-box" id="code-output"></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="ctrl-group">
      <h3>Presets</h3>
      <div class="presets" id="presets"></div>
    </div>

    <div class="ctrl-group">
      <h3>Cores</h3>
      <div class="ctrl-row">
        <label>Casa clara</label>
        <input type="color" id="col-light">
        <input type="text" id="txt-light" maxlength="7">
        <div class="swatch" id="sw-light"></div>
      </div>
      <div class="ctrl-row">
        <label>Casa escura</label>
        <input type="color" id="col-dark">
        <input type="text" id="txt-dark" maxlength="7">
        <div class="swatch" id="sw-dark"></div>
      </div>
      <div class="ctrl-row">
        <label>Moldura</label>
        <input type="color" id="col-frame">
        <input type="text" id="txt-frame" maxlength="7">
        <div class="swatch" id="sw-frame"></div>
      </div>
    </div>

    <div class="ctrl-group">
      <h3>Textura (multiply, fractalNoise)</h3>
      <div class="ctrl-row">
        <label>Intensidade</label>
        <input type="range" id="tex-slope" min="0" max="0.50" step="0.01" value="0.20">
        <span id="slope-val" style="width:40px;font-size:12px;color:#aaa;font-family:monospace">0.20</span>
      </div>
      <div class="ctrl-row" style="font-size:11px;color:#666">
        slope=<span id="slope-disp">0.20</span> intercept=<span id="intcpt-disp">0.80</span> → [<span id="range-disp">0.80–1.0</span>]
      </div>
    </div>
  </div>
</div>

<!-- SVG defs (gerado dinamicamente) -->
<svg width="0" height="0" style="position:absolute">
  <defs id="svg-defs"></defs>
</svg>

<script>
const PRESETS = [
  { name: "Chess.com Wood (oficial)",  light: "#f0d9b5", dark: "#b58863", frame: "#251400" },
  { name: "Chess.com Walnut",          light: "#d4a96a", dark: "#7a4828", frame: "#2a1200" },
  { name: "Chess.com Walnut dark",     light: "#c8a058", dark: "#6b3818", frame: "#200e00" },
  { name: "Referência imagem #24",     light: "#cda870", dark: "#7a4830", frame: "#251800" },
  { name: "ChessBase marrom",          light: "#e8c890", dark: "#905828", frame: "#1e0800" },
  { name: "ChessBase claro",           light: "#ede0c8", dark: "#a07850", frame: "#1e0b00" },
  { name: "Lichess",                   light: "#dee3e6", dark: "#8ca2ad", frame: "#1a2530" },
];

// State
let state = { light: "#cda870", dark: "#7a4830", frame: "#251800", slope: 0.20 };

function hexToRgb(h) {
  const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16);
  return [r,g,b];
}

function updateFilterDef(slope) {
  const intercept = (1 - slope).toFixed(2);
  document.getElementById("svg-defs").innerHTML = `
    <filter id="wg" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.018" numOctaves="8" seed="42" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g">
        <feFuncR type="linear" slope="${slope}" intercept="${intercept}"/>
        <feFuncG type="linear" slope="${slope}" intercept="${intercept}"/>
        <feFuncB type="linear" slope="${slope}" intercept="${intercept}"/>
      </feComponentTransfer>
    </filter>
    <symbol id="tex" viewBox="0 0 560 560" preserveAspectRatio="none">
      <rect width="560" height="560" fill="white" filter="url(#wg)"/>
    </symbol>`;
  document.getElementById("slope-disp").textContent = slope.toFixed(2);
  document.getElementById("intcpt-disp").textContent = intercept;
  const lo = parseFloat(intercept).toFixed(2);
  document.getElementById("range-disp").textContent = `${lo}–1.0`;
}

function buildBoard(light, dark, frame, withTexture) {
  const wrap = document.createElement("div");
  wrap.className = "board-frame";
  wrap.style.background = frame;
  wrap.style.padding = "10px";

  const board = document.createElement("div");
  board.className = "board";

  const grid = document.createElement("div");
  grid.className = "grid";
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement("div");
      sq.className = "sq";
      sq.style.background = (r+c)%2===0 ? light : dark;
      grid.appendChild(sq);
    }
  }
  board.appendChild(grid);

  if (withTexture) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "overlay-svg");
    svg.style.mixBlendMode = "multiply";
    const use = document.createElementNS(ns, "use");
    use.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#tex");
    svg.appendChild(use);
    board.appendChild(svg);
  }

  wrap.appendChild(board);
  return wrap;
}

// Chess.com reference board (static, from image #24 analysis)
function buildChessComReference() {
  // Colors sampled from image #24
  return buildBoard("#cda870", "#7a4830", "#251800", false);
}

function renderAll() {
  const { light, dark, frame, slope } = state;

  updateFilterDef(slope);

  // My board
  const myWrap = document.getElementById("my-board-wrap");
  myWrap.innerHTML = "";
  myWrap.appendChild(buildBoard(light, dark, frame, true));

  // Chess.com reference (fixed)
  const ccWrap = document.getElementById("chesscom-board-wrap");
  if (!ccWrap.firstChild) ccWrap.appendChild(buildChessComReference());

  // Code output
  const intercept = (1 - slope).toFixed(2);
  document.getElementById("code-output").textContent =
    `classico: { claro: "${light}", escuro: "${dark}", moldura: "${frame}" }\n\n` +
    `// SVG overlay: slope=${slope.toFixed(2)}, intercept=${intercept}\n` +
    `// blend: multiply`;
}

// Color sync helpers
function syncColor(key, value) {
  state[key] = value;
  document.getElementById(`col-${key.replace("light","light").replace("dark","dark").replace("frame","frame")}`).value = value;
  document.getElementById(`txt-${key.replace("light","light").replace("dark","dark").replace("frame","frame")}`).value = value;
  document.getElementById(`sw-${key.replace("light","light").replace("dark","dark").replace("frame","frame")}`).style.background = value;
}

function setupColorControl(key) {
  const col = document.getElementById(`col-${key}`);
  const txt = document.getElementById(`txt-${key}`);
  col.addEventListener("input", e => { syncColor(key, e.target.value); renderAll(); });
  txt.addEventListener("input", e => {
    const v = e.target.value;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { syncColor(key, v); renderAll(); }
  });
}

// Init controls
setupColorControl("light");
setupColorControl("dark");
setupColorControl("frame");

document.getElementById("tex-slope").addEventListener("input", e => {
  state.slope = parseFloat(e.target.value);
  document.getElementById("slope-val").textContent = state.slope.toFixed(2);
  renderAll();
});

// Presets
const presetsEl = document.getElementById("presets");
PRESETS.forEach((p, i) => {
  const btn = document.createElement("button");
  btn.className = "preset-btn";
  btn.textContent = p.name;
  btn.onclick = () => {
    document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    syncColor("light", p.light);
    syncColor("dark", p.dark);
    syncColor("frame", p.frame);
    renderAll();
  };
  presetsEl.appendChild(btn);
});

// Initial render
syncColor("light", state.light);
syncColor("dark", state.dark);
syncColor("frame", state.frame);
renderAll();
</script>
</body>
</html>
