<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800">
  <!--
    Casas claras (bordo/maple) — textura mais suave que as escuras.
    baseFrequency X=0.05: bandas mais largas, menos frequentes (madeira mais clara = grão mais aberto)
    baseFrequency Y=0.018: curva mais suave
    seed=31: padrão completamente diferente das casas escuras
    slope=1.18: contraste suave — casas claras têm textura quase imperceptível
  -->
  <filter id="w" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.05 0.018"
      numOctaves="8"
      seed="31"
      result="noise"
    />
    <feColorMatrix type="saturate" values="0" in="noise" result="grain"/>
    <feComponentTransfer in="grain">
      <feFuncR type="linear" slope="1.18" intercept="-0.090"/>
      <feFuncG type="linear" slope="1.18" intercept="-0.090"/>
      <feFuncB type="linear" slope="1.18" intercept="-0.090"/>
    </feComponentTransfer>
  </filter>
  <rect width="800" height="800" fill="#808080" filter="url(#w)"/>
</svg>
